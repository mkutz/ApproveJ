group=org.approvej
version=SNAPSHOT
description=ApproveJ
# IntelliJ Platform Gradle Plugin keeps the JARs of the downloaded IDE open in a cache that
# expires 10s after the last access. On slow machines that expiry hits while the bundled
# plugins are still being indexed, which closes the ZIP file system and makes com.intellij.java
# unresolvable. See https://github.com/JetBrains/intellij-platform-gradle-plugin/issues/2192
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dcom.jetbrains.plugin.structure.jar.SingletonCachingJarFileSystemProvider.retentionTime=600
org.gradle.caching=true
org.gradle.parallel=true
signing.secretKeyRingFile=~/.gnupg/secring.gpg
