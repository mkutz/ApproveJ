name: Build PR

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.adoc'

jobs:
  build:
    permissions:
      checks: write
      pull-requests: write
      contents: write

    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check line endings
        run: |
          git add --renormalize .
          if ! git diff --cached --quiet; then
            echo "::error::Files are not normalized according to .gitattributes. Run 'git add --renormalize .' and commit the result."
            git diff --cached --stat
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c

      - run: ./gradlew check

      - name: cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - run: ./gradlew build jacocoTestReport sonar
        if: ${{ env.SONAR_TOKEN != '' && github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: modules-test-reports
          path: |
            modules/**/build/reports/tests/test/
            plugins/**/build/reports/tests/test/

      - name: Enable auto merge for Dependabot PRs
        run: |
          gh pr review --approve "${{ github.event.pull_request.html_url }}"
          gh pr merge --auto --rebase --delete-branch "${{ github.event.pull_request.html_url }}"
        if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest

    steps:

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c

      - run: ./gradlew check

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: windows-test-reports
          path: |
            modules/**/build/reports/tests/test/
            plugins/**/build/reports/tests/test/
